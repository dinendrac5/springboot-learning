spring.application.name=springboot-learning

# postgresql connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bizflow}
spring.datasource.username=${DB_USERNAME:bizflow}
spring.datasource.password=${DB_PASSWORD}

#Hibernate validates the schema instead of creating tables
spring.jpa.hibernate.ddl-auto=validate

#Flyway manages database schema changes
spring.flyway.enabled=true
spring.flyway.default-schema=bizflow
spring.flyway.schemas=bizflow
spring.jpa.properties.hibernate.default_schema=bizflow