services:
  postgres:
    image: postgres:17
    container_name: bizflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizflow
      POSTGRES_USER: ${DB_USERNAME:-bizflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: